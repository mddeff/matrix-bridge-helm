apiVersion: v2
name: mautrix-signal
description: A Helm chart for the Mautrix Matrix-Signal puppeting bridge.

type: application

version: 0.0.4

# TEMPORARY edge-build pin (image.tag defaults to appVersion). v26.10 and earlier fail
# Matrix->Signal attachment uploads with HTTP 400: Signal-Server v20261104.0.0 made
# `uploadLength` required on GET /v4/attachments/form/upload. Fixed by mautrix/signal
# PR #703 (merge e2e994f, 2026-11-04), which is in main but not yet in a tagged release.
# Pinned to that fix commit; edge images are per-arch (target dmz node = amd64). Revert
# to a clean "v26.11" appVersion once that release ships (~2026-11-16).
appVersion: "e2e994f99f8dfffe5ad1cc88a2d36449639a609e-amd64"

maintainers:
  - name: Mike Deffenbaugh
    url: https://zeroent.net
sources:
  - https://github.com/mautrix/signal
  - https://github.com/mddeff/matrix-bridge-helm

# No chart dependencies: the chart no longer bundles the Bitnami postgresql subchart.
# Postgres is now provided by `database.mode` -- either an external DSN ("external") or a
# CloudNativePG `Cluster` CR rendered by this chart ("cnpg"). This also removes the CI's
# fragile `helm dependency build` against the sunsetting Bitnami chart repo.
